{% extends "base.html" %}
{% block title %}{{ status_code }} — NoteFlow{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-24 text-center animate-fade-in">
  <div class="w-24 h-24 mb-6 rounded-3xl bg-gradient-to-br from-red-100 to-red-200
              dark:from-red-900/40 dark:to-red-800/40
              flex items-center justify-center shadow-inner">
    <svg class="w-12 h-12 text-red-400 dark:text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      {% if status_code == 404 %}
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      {% else %}
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      {% endif %}
    </svg>
  </div>

  <div class="text-6xl font-black text-slate-200 dark:text-slate-700 mb-3 select-none">
    {{ status_code }}
  </div>

  <h1 class="text-xl font-bold text-slate-700 dark:text-slate-200 mb-2">
    {% if status_code == 404 %}Page not found{% else %}Something went wrong{% endif %}
  </h1>

  <p class="text-slate-400 dark:text-slate-500 max-w-sm mb-8 text-sm">
    {{ message }}
  </p>

  <a href="/"
     class="inline-flex items-center gap-2 px-6 py-3 rounded-xl
            bg-primary-600 hover:bg-primary-700 text-white font-semibold
            shadow-lg hover:shadow-xl transition-all duration-200">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
    </svg>
    Go to Dashboard
  </a>
</div>
{% endblock %}
