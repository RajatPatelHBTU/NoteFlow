<!-- Confirm Delete Modal Partial -->
<div id="confirm-delete-modal"
     class="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in"
     role="dialog" aria-modal="true" aria-labelledby="modal-title">

  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"
       onclick="closeModal()"></div>

  <!-- Dialog -->
  <div class="relative w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-2xl
              border border-slate-200 dark:border-slate-700 animate-slide-up p-6">

    <!-- Icon -->
    <div class="w-12 h-12 rounded-xl bg-red-100 dark:bg-red-900/30 flex items-center justify-center mb-4">
      <svg class="w-6 h-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    </div>

    <!-- Content -->
    <h2 id="modal-title" class="text-lg font-bold text-slate-900 dark:text-white mb-2">
      Delete Note?
    </h2>
    <p class="text-slate-500 dark:text-slate-400 text-sm mb-6">
      Are you sure you want to delete <strong class="text-slate-700 dark:text-slate-200">{{ note_title }}</strong>?
      This action cannot be undone.
    </p>

    <!-- Buttons -->
    <div class="flex gap-3">
      <button onclick="closeModal()"
              class="flex-1 px-4 py-2.5 rounded-xl text-sm font-medium
                     border border-slate-200 dark:border-slate-600
                     text-slate-600 dark:text-slate-300
                     hover:bg-slate-50 dark:hover:bg-slate-700
                     transition-colors duration-150">
        Cancel
      </button>
      <button hx-delete="/htmx/notes/{{ note_id }}"
              hx-target="#note-{{ note_id }}"
              hx-swap="outerHTML swap:0.3s"
              hx-on::after-request="closeModal()"
              class="flex-1 px-4 py-2.5 rounded-xl text-sm font-semibold
                     bg-red-500 hover:bg-red-600 dark:bg-red-600 dark:hover:bg-red-700
                     text-white shadow-sm hover:shadow-md
                     transition-all duration-150">
        Delete Note
      </button>
    </div>
  </div>
</div>
