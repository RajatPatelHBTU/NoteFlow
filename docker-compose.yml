version: "3.9"

services:

  # ── FastAPI Application ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: noteflow-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - DATABASE_NAME=notes_db
      - APP_ENV=production
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - noteflow-net

  # ── MongoDB ──────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: noteflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - noteflow-net

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local

networks:
  noteflow-net:
    driver: bridge
